<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }


        /* ================= MAIN CONTAINER ================= */

        .container {
            width: 900px;
            max-width: 95%;
            margin: 30px auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }


        /* ================= STUDENT DETAILS ================= */

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #334155;
        }

        .student-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }


        /* ================= SUBJECT GRID ================= */

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .subject {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .subject label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #475569;
        }

        .subject input {
            background: white;
        }


        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;
            gap: 15px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .calculate-btn {
            background: #4f46e5;
            color: white;
        }

        .calculate-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .reset-btn:hover {
            background: #cbd5e1;
        }


        /* ================= ERROR ================= */

        #error {
            color: #dc2626;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }


        /* ================= RESULT ================= */

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .result-heading {
            text-align: center;
            margin-bottom: 20px;
        }

        .result-heading h2 {
            color: #334155;
            margin-bottom: 5px;
        }

        .result-heading p {
            color: #64748b;
        }


        /* ================= RESULT CARDS ================= */

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-card {
            background: white;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .result-card h3 {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .result-card p {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }


        /* ================= GRADE ================= */

        .grade-section {
            text-align: center;
            margin: 20px 0;
        }

        .grade-badge {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            background: #4f46e5;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }


        /* ================= PROGRESS BAR ================= */

        .progress-container {
            margin-top: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-weight: bold;
            color: #475569;
        }

        .progress {
            width: 100%;
            height: 13px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border-radius: 20px;
            transition: width 1s ease;
        }


        /* ================= STATUS ================= */

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .pass {
            background: #dcfce7;
            color: #15803d;
        }

        .fail {
            background: #fee2e2;
            color: #dc2626;
        }


        /* ================= FOOTER ================= */

        footer {
            text-align: center;
            padding: 18px;
            color: #64748b;
            font-size: 14px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .container {
                padding: 20px;
            }

            .subject-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .student-details {
                grid-template-columns: 1fr;
            }

            .subject-grid {
                grid-template-columns: 1fr;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            header h1 {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <h1>🎓 Student Grade Calculator</h1>

        <p>
            Calculate marks, percentage and grade instantly
        </p>

    </header>



    <!-- ================= MAIN ================= -->

    <div class="container">


        <!-- Student Information -->

        <div class="section-title">
            👤 Student Information
        </div>

        <div class="student-details">

            <div class="input-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name">

            </div>


            <div class="input-group">

                <label for="roll">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="roll"
                    placeholder="Enter roll number">

            </div>

        </div>



        <!-- Subject Marks -->

        <div class="section-title">
            📚 Enter Subject Marks
        </div>


        <div class="subject-grid">


            <!-- Mathematics -->

            <div class="subject">

                <label for="math">
                    Mathematics
                </label>

                <input
                    type="number"
                    id="math"
                    placeholder="0 - 100"
                    min="0"
                    max="100">

            </div>


            <!-- Science -->

            <div class="subject">

                <label for="science">
                    Science
                </label>

                <input
                    type="number"
                    id="science"
                    placeholder="0 - 100"
                    min="0"
                    max="100">

            </div>


            <!-- English -->

            <div class="subject">

                <label for="english">
                    English
                </label>

                <input
                    type="number"
                    id="english"
                    placeholder="0 - 100"
                    min="0"
                    max="100">

            </div>


            <!-- Computer -->

            <div class="subject">

                <label for="computer">
                    Computer
                </label>

                <input
                    type="number"
                    id="computer"
                    placeholder="0 - 100"
                    min="0"
                    max="100">

            </div>


            <!-- Hindi -->

            <div class="subject">

                <label for="hindi">
                    Hindi
                </label>

                <input
                    type="number"
                    id="hindi"
                    placeholder="0 - 100"
                    min="0"
                    max="100">

            </div>

        </div>



        <!-- ================= BUTTONS ================= -->

        <div class="buttons">

            <button
                class="calculate-btn"
                onclick="calculateGrade()">

                Calculate Result

            </button>


            <button
                class="reset-btn"
                onclick="resetForm()">

                Reset

            </button>

        </div>


        <!-- Error Message -->

        <p id="error"></p>



        <!-- ================= RESULT ================= -->

        <div id="result">


            <div class="result-heading">

                <h2>📊 Result Summary</h2>

                <p>
                    Here is the calculated result
                </p>

            </div>


            <!-- Result Cards -->

            <div class="result-grid">


                <!-- Student -->

                <div class="result-card">

                    <h3>
                        STUDENT
                    </h3>

                    <p
                        id="studentName"
                        style="font-size: 18px;">
                    </p>

                </div>


                <!-- Total -->

                <div class="result-card">

                    <h3>
                        TOTAL MARKS
                    </h3>

                    <p>
                        <span id="total"></span>
                        / 500
                    </p>

                </div>


                <!-- Percentage -->

                <div class="result-card">

                    <h3>
                        PERCENTAGE
                    </h3>

                    <p>
                        <span id="percentage"></span>%
                    </p>

                </div>

            </div>



            <!-- Grade -->

            <div class="grade-section">

                <p style="margin-bottom: 10px;
                          color: #64748b;
                          font-weight: bold;">
                    YOUR GRADE
                </p>

                <span
                    id="grade"
                    class="grade-badge">
                </span>

            </div>



            <!-- Progress Bar -->

            <div class="progress-container">

                <div class="progress-label">

                    <span>
                        Performance
                    </span>

                    <span>
                        <span id="progressText">
                            0
                        </span>%
                    </span>

                </div>

                <div class="progress">

                    <div
                        id="progressBar"
                        class="progress-bar">
                    </div>

                </div>

            </div>



            <!-- Pass / Fail Status -->

            <div
                id="status"
                class="status">

            </div>


        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Student Grade Calculator |
        JavaScript Practical

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        // ================= CALCULATE GRADE =================

        function calculateGrade() {


            // Get student details

            let name =
                document.getElementById("name").value.trim();

            let roll =
                document.getElementById("roll").value.trim();


            // Get subject marks

            let math =
                parseFloat(document.getElementById("math").value);

            let science =
                parseFloat(document.getElementById("science").value);

            let english =
                parseFloat(document.getElementById("english").value);

            let computer =
                parseFloat(document.getElementById("computer").value);

            let hindi =
                parseFloat(document.getElementById("hindi").value);


            // Error element

            let error =
                document.getElementById("error");


            // Clear previous error

            error.innerHTML = "";


            // ================= VALIDATION =================


            if (name === "") {

                error.innerHTML =
                    "⚠ Please enter student name.";

                return;
            }


            if (roll === "") {

                error.innerHTML =
                    "⚠ Please enter roll number.";

                return;
            }


            // Check empty marks

            if (
                isNaN(math) ||
                isNaN(science) ||
                isNaN(english) ||
                isNaN(computer) ||
                isNaN(hindi)
            ) {

                error.innerHTML =
                    "⚠ Please enter marks for all subjects.";

                return;
            }


            // Check range

            if (
                math < 0 || math > 100 ||
                science < 0 || science > 100 ||
                english < 0 || english > 100 ||
                computer < 0 || computer > 100 ||
                hindi < 0 || hindi > 100
            ) {

                error.innerHTML =
                    "⚠ Marks must be between 0 and 100.";

                return;
            }



            // ================= CALCULATION =================


            // Total marks

            let total =
                math +
                science +
                english +
                computer +
                hindi;


            // Percentage

            let percentage =
                (total / 500) * 100;


            // ================= GRADE =================


            let grade;


            if (percentage >= 90) {

                grade = "A+";

            }

            else if (percentage >= 80) {

                grade = "A";

            }

            else if (percentage >= 70) {

                grade = "B";

            }

            else if (percentage >= 60) {

                grade = "C";

            }

            else if (percentage >= 50) {

                grade = "D";

            }

            else {

                grade = "F";

            }



            // ================= DISPLAY RESULT =================


            document.getElementById("studentName")
                .innerHTML = name;


            document.getElementById("total")
                .innerHTML = total;


            document.getElementById("percentage")
                .innerHTML = percentage.toFixed(2);


            document.getElementById("grade")
                .innerHTML = grade;


            // Progress bar

            document.getElementById("progressBar")
                .style.width = percentage + "%";


            document.getElementById("progressText")
                .innerHTML = percentage.toFixed(2);



            // ================= PASS / FAIL =================


            let status =
                document.getElementById("status");


            if (percentage >= 50) {

                status.innerHTML =
                    "✅ Congratulations! You have Passed.";

                status.className =
                    "status pass";

            }

            else {

                status.innerHTML =
                    "❌ Unfortunately, you have Failed.";

                status.className =
                    "status fail";

            }



            // Show result

            document.getElementById("result")
                .style.display = "block";


            // Scroll smoothly to result

            document.getElementById("result")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }



        // ================= RESET FUNCTION =================

        function resetForm() {


            // Clear all inputs

            document.getElementById("name").value = "";

            document.getElementById("roll").value = "";

            document.getElementById("math").value = "";

            document.getElementById("science").value = "";

            document.getElementById("english").value = "";

            document.getElementById("computer").value = "";

            document.getElementById("hindi").value = "";


            // Clear error

            document.getElementById("error")
                .innerHTML = "";


            // Hide result

            document.getElementById("result")
                .style.display = "none";


            // Reset progress bar

            document.getElementById("progressBar")
                .style.width = "0%";

        }

    </script>

</body>

</html>
