<!DOCTYPE html>
<html>
    <head>
        <title> Student information Form </title>
    </head>
    <body>
        <h1> STUDENT INFORMATION FORM  </h1>
    
    <table>
        <tr>
            <td>
              <fieldset>
    <legend><b>Personal Information</b> </legend>

    <form action="" method="get" class="form-example">
    <div class="form-example">
    <label for="name">Student name: </label>
    <input type="text" name="name" id="name" required />
    </div>
    <br>

    <div class="form-example">
    <label for="email">Enter your email: </label>
    <input type="email" name="email" id="email" required />
    </div>
    <br>

    <div class="form-example">
    <label for="Contact No.">Enter Contact no. :</label>
    <input type="number" name="mobile" name="mobile" required/>
    </div>
    <br>

    <div class="form-example">
    <label for="Gender"> Gender :</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    </div>
    </fieldset>  
    </td>
        

    <td>
        <fieldset>
        <legend> <b> Academic Information </b></legend>

        <form action="" method="get" class="form-example">

        <div class="form-example">
        <label for="Branch"> Branch : </label>
        <label for="pet-select">Select Branch</label>

    <select name="branch" id="Branch-select">
        <option value="">--Please choose an option--</option>
        <option value="branch">Computer science</option>
        <option value="branch">Information Technology</option>
        <option value="branch">Artificial Intelligence </option>
        <option value="branch"> Data Science </option>
        <option value="spider">Electrical Engineering</option>
        <option value="goldfish">Civil Engineering</option>
    </select>
        
        </div>
        <br>

        <div class="form-example">
        <label for="year">Year : </label>
        <input type="year" name="year" id="year" required />
        </div>
        <br>

        <div>
        <label for="email"> USN No. : </label>
        <input type="text" name="usn" id="usn" required/>
        </div>
        <br>
        

        <div class="form-example">
        <label for="CGPA"> II sem CGPA : </label>
        <input type="text" name="cgpa" id="cgpa" required/>
        </div>
    </form>
    </fieldset>
    <br>

    
    </td>
    </tr>
    </table> 



<table>
    <tr>
        <td>
          <fieldset>
        <legend><b>Contact Details</b></legend>
        <form action="" method="get" class="form-example">

        <div class="form-example">
        <label for="address">Enter Address: </label>
        <input type="text" name="name" id="name" required />
        </div>
        <br>

        <div class="form-example">
        <label for="city">Enter City: </label>
        <input type="city" name="city" id="city" required />
        </div>
        <br>

        <div class="form-example">
        <label for="pin">Pin code: </label>
        <input type="pin" name="pin" id="pin" required />
        </div>
</form>

        </fieldset>  
        </td>
    </tr>
</table>
<br>

    <input type="submit" value="Submit">
<input type="reset" value="Reset">

    </form>
    </body>
</html>
